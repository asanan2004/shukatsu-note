<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://www.googleapis.com; object-src 'none'; base-uri 'none'">
  <title>就活ノート</title>
  <link rel="stylesheet" href="style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="就活ノート">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header>
    <div class="heading"><h1>就活ノート</h1><span id="save-state" role="status">読込中</span><button id="sync-state" type="button" hidden></button></div>
    <input id="global-search" type="search" placeholder="すべてから検索" aria-label="すべてから検索">
    <nav aria-label="メイン"><a href="#today">今日</a><a href="#deadlines">締め切り</a><a href="#plans">予定</a><a href="#pipeline">選考</a><a href="#mypages">マイページ</a><a href="#gakuchika">ガクチカ</a><a href="#es">ES設問バンク</a><a href="#support">判断サポート</a><a href="#data">データ</a></nav>
  </header>
  <main>
    <p>データはこの端末のブラウザの中にだけ保存されます(PC の拡張機能とは別)。『データ』画面の書き出し・取り込みで受け渡してください。</p>
    <p id="message" role="status"></p>
    <div id="backup-reminder" role="status"></div><div id="view"></div>
  </main>
  <div id="more-sheet" class="more-sheet" hidden></div>
  <nav id="bottom-tabs" class="bottom-tabs" aria-label="下のメニュー"></nav>
  <dialog id="editor"><form id="edit-form"><div id="fields"></div><div class="actions"><button type="submit">変更を反映</button><button type="button" id="close-editor">閉じる</button></div></form></dialog>
  <script src="browser-storage.js"></script>
  <script src="icons.js"></script>
  <script src="company-name.js"></script>
  <script src="deadline-parse.js"></script>
  <script src="core.js"></script>
  <script src="storage.js"></script>
  <script src="deadlines.js"></script>
  <script src="gakuchika.js"></script>
  <script src="es.js"></script>
  <script src="esplus.js"></script>
  <script src="interview.js"></script>
  <script src="safety.js"></script>
  <script src="schedule.js"></script>
  <script src="review.js"></script>
  <script src="mypages.js"></script>
  <script src="company.js"></script>
  <script src="research.js"></script>
  <script src="pipeline.js"></script>
  <script src="today.js"></script>
  <script src="decisions.js"></script>
  <script src="support.js"></script>
  <script src="sync-config.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
